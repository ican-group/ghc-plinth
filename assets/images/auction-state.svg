<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 450" role="img"
     aria-label="An auction as a chain of outputs at one script address: each bid transaction spends the current auction output, creates the next one with the new highest bid in its datum, and refunds the previous owner of the ada.">
  <style>
    .zone-label { font: 700 14px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .box-text   { font: 600 13px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2d3d; }
    .sub        { font: 400 12px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #5a6b7b; }
    .tx-text    { font: 600 13px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .tx-sub     { font: 400 12px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #dfe6ee; }
    .caption    { font: italic 400 12px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #5a6b7b; }
    .box   { fill: #ffffff; stroke: #5b7fa6; stroke-width: 1.5; }
    .state { fill: #ffffff; stroke: #2f8f55; stroke-width: 1.8; }
    .pivot { fill: #fff3d6; stroke: #d8a93a; stroke-width: 1.8; }
    .tx    { fill: #2c3e50; }
    .flow  { fill: none; stroke: #5a6b7b; stroke-width: 1.6; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <!-- Wallet addresses -->
  <rect x="10" y="14" width="1010" height="104" rx="10" fill="#eaf2fb" stroke="#b9d4f1"/>
  <text x="26" y="36" class="zone-label" fill="#2c5d99">Wallet addresses (each one is locked by a key)</text>

  <rect class="box" x="100" y="48" width="120" height="56" rx="6"/>
  <text class="box-text" x="160" y="71" text-anchor="middle">Seller</text>
  <text class="sub"      x="160" y="89" text-anchor="middle">2 ada</text>

  <rect class="box" x="250" y="48" width="120" height="56" rx="6"/>
  <text class="box-text" x="310" y="71" text-anchor="middle">Alice</text>
  <text class="sub"      x="310" y="89" text-anchor="middle">100 ada</text>

  <rect class="pivot" x="380" y="48" width="120" height="56" rx="6"/>
  <text class="box-text" x="440" y="71" text-anchor="middle">Seller (refund)</text>
  <text class="sub"      x="440" y="89" text-anchor="middle">2 ada back</text>

  <rect class="box" x="510" y="48" width="120" height="56" rx="6"/>
  <text class="box-text" x="570" y="71" text-anchor="middle">Bob</text>
  <text class="sub"      x="570" y="89" text-anchor="middle">150 ada</text>

  <rect class="pivot" x="640" y="48" width="120" height="56" rx="6"/>
  <text class="box-text" x="700" y="71" text-anchor="middle">Alice (refund)</text>
  <text class="sub"      x="700" y="89" text-anchor="middle">100 ada back</text>

  <rect class="box" x="770" y="48" width="120" height="56" rx="6"/>
  <text class="box-text" x="830" y="71" text-anchor="middle">Bob</text>
  <text class="sub"      x="830" y="89" text-anchor="middle">the item + 2 ada</text>

  <rect class="box" x="895" y="48" width="120" height="56" rx="6"/>
  <text class="box-text" x="955" y="71" text-anchor="middle">Seller</text>
  <text class="sub"      x="955" y="89" text-anchor="middle">150 ada</text>

  <!-- Transactions -->
  <text x="26" y="150" class="zone-label" fill="#5a6b7b">Transactions</text>

  <rect class="tx" x="20"  y="158" width="180" height="52" rx="6"/>
  <text class="tx-text" x="110" y="180" text-anchor="middle">Start</text>
  <text class="tx-sub"  x="110" y="198" text-anchor="middle">the seller mints the item</text>

  <rect class="tx" x="290" y="158" width="160" height="52" rx="6"/>
  <text class="tx-text" x="370" y="180" text-anchor="middle">Bid 100</text>
  <text class="tx-sub"  x="370" y="198" text-anchor="middle">by Alice</text>

  <rect class="tx" x="550" y="158" width="160" height="52" rx="6"/>
  <text class="tx-text" x="630" y="180" text-anchor="middle">Bid 150</text>
  <text class="tx-sub"  x="630" y="198" text-anchor="middle">by Bob</text>

  <rect class="tx" x="810" y="158" width="160" height="52" rx="6"/>
  <text class="tx-text" x="890" y="180" text-anchor="middle">Payout</text>
  <text class="tx-sub"  x="890" y="198" text-anchor="middle">after the end time</text>

  <!-- Script address -->
  <rect x="10" y="238" width="1010" height="172" rx="10" fill="#eaf7ee" stroke="#b9e3c6"/>
  <text x="26" y="396" class="zone-label" fill="#2f8f55">Script address: the hash of the validator and its parameters (the same for every state)</text>

  <rect class="state" x="145" y="276" width="190" height="94" rx="6"/>
  <text class="box-text" x="240" y="302" text-anchor="middle">Auction output 1</text>
  <text class="sub"      x="240" y="324" text-anchor="middle">datum: no bid</text>
  <text class="sub"      x="240" y="344" text-anchor="middle">value: the item + 2 ada</text>

  <rect class="state" x="405" y="276" width="190" height="94" rx="6"/>
  <text class="box-text" x="500" y="302" text-anchor="middle">Auction output 2</text>
  <text class="sub"      x="500" y="324" text-anchor="middle">datum: Alice, 100</text>
  <text class="sub"      x="500" y="344" text-anchor="middle">value: the item + 100 ada</text>

  <rect class="state" x="665" y="276" width="190" height="94" rx="6"/>
  <text class="box-text" x="760" y="302" text-anchor="middle">Auction output 3</text>
  <text class="sub"      x="760" y="324" text-anchor="middle">datum: Bob, 150</text>
  <text class="sub"      x="760" y="344" text-anchor="middle">value: the item + 150 ada</text>

  <text x="26" y="436" class="caption">An arrow into a transaction is an output that it spends. An arrow out of a transaction is an output that it creates. Fees and change are not shown.</text>

  <!-- wallet outputs spent by the transactions -->
  <line class="flow" x1="160" y1="104" x2="160" y2="156" marker-end="url(#arrow)"/>
  <line class="flow" x1="310" y1="104" x2="345" y2="156" marker-end="url(#arrow)"/>
  <line class="flow" x1="395" y1="158" x2="435" y2="106" marker-end="url(#arrow)"/>
  <line class="flow" x1="570" y1="104" x2="595" y2="156" marker-end="url(#arrow)"/>

  <!-- wallet outputs created by the transactions -->
  <line class="flow" x1="665" y1="158" x2="695" y2="106" marker-end="url(#arrow)"/>
  <line class="flow" x1="860" y1="158" x2="835" y2="106" marker-end="url(#arrow)"/>
  <line class="flow" x1="925" y1="158" x2="950" y2="106" marker-end="url(#arrow)"/>

  <!-- the chain of auction outputs -->
  <line class="flow" x1="130" y1="210" x2="205" y2="274" marker-end="url(#arrow)"/>
  <line class="flow" x1="280" y1="276" x2="345" y2="212" marker-end="url(#arrow)"/>
  <line class="flow" x1="395" y1="210" x2="465" y2="274" marker-end="url(#arrow)"/>
  <line class="flow" x1="540" y1="276" x2="605" y2="212" marker-end="url(#arrow)"/>
  <line class="flow" x1="655" y1="210" x2="725" y2="274" marker-end="url(#arrow)"/>
  <line class="flow" x1="800" y1="276" x2="865" y2="212" marker-end="url(#arrow)"/>
</svg>
